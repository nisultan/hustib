# Ticks the Telegram reminders. Vercel's free plan only runs cron once a day,
# so the schedule lives here instead. Needs two repository secrets:
#   APP_URL      e.g. https://your-app.vercel.app (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET env var on Vercel
name: telegram-reminders

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets not set yet"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/telegram/cron"
