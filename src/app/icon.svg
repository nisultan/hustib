<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The tab icon, drawn to match components/Logo.tsx. The accent is fixed
       here because a favicon renders outside the page and cannot read the
       student's chosen accent variable.

       The brackets are weighted heavier than the component's and pulled a
       little further out: at sixteen pixels a 2.1 stroke closes up against the
       centre dot and the whole thing silts into a blob. -->
  <rect width="32" height="32" rx="7" fill="#5b5bd6" />
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.6 12V9a2.4 2.4 0 0 1 2.4-2.4H12" />
    <path d="M20 6.6h3a2.4 2.4 0 0 1 2.4 2.4V12" />
    <path d="M25.4 20v3a2.4 2.4 0 0 1-2.4 2.4H20" />
    <path d="M12 25.4H9A2.4 2.4 0 0 1 6.6 23V20" />
  </g>
  <circle cx="16" cy="16" r="3.8" fill="#fff" />
</svg>
