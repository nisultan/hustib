<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The tab icon, drawn to match components/Logo.tsx. The accent is fixed
       here because a favicon renders outside the page and cannot read the
       student's chosen accent variable.

       Weights are a touch heavier than the component's, because a favicon is
       rendered at sixteen pixels and a 1.7 stroke disappears there. -->
  <rect width="32" height="32" rx="7" fill="#5b5bd6" />
  <g fill="none" stroke="#fff" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M8.5 7 V24.5 H25" stroke-width="2.4" opacity="0.5" />
    <path d="M11.6 19.2 L16.4 13.8 L20.1 16.4 L25.6 9.2" stroke-width="3" stroke-miterlimit="3" />
  </g>
</svg>
